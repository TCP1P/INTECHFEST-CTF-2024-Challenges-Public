# yaml-language-server: $schema=../../challenge.schema.yaml
name: "CJ Revenge"
author: "aimardcr"
category: Misc
description: |
    no it's not cyber jawara, it's c jail but without unintended (i hope so).

value: 1000
type: DynamicContainer

scripts:
    start: cd chall && docker build -t cjail-revenge .

container:
    containerImage: "cjail-revenge:latest"
    flagTemplate: INTECHFEST{cj_revenge_c16f3f2d_[TEAM_HASH]}
    memoryLimit: 512
    cpuCount: 2
    storageLimit: 512
    containerExposePort: 8080
    enableTrafficCapture: false

provide: ./dist
